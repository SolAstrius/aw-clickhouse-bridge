[package]
name = "aw-clickhouse-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
# From aw-server-rust (git deps)
aw-models = { git = "https://github.com/ActivityWatch/aw-server-rust" }
aw-transform = { git = "https://github.com/ActivityWatch/aw-server-rust" }

# HTTP
axum = "0.7"
tokio = { version = "1", features = ["full", "signal"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# ClickHouse
clickhouse = { version = "0.14", features = ["time", "rustls-tls"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Utils
uuid = { version = "1", features = ["v4"] }
gethostname = "0.5"
directories = "5"
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"

# Embedded webui
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
